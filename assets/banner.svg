<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="gemini-to-dsh — Gemini и Google Search в DeepSeek Harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06070a"/>
      <stop offset="0.5" stop-color="#090b10"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="ambLeft" cx="0.12" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.13"/>
      <stop offset="0.5" stop-color="#34d399" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#06070a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambRight" cx="0.84" cy="0.62" r="0.52">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.15"/>
      <stop offset="0.45" stop-color="#6366f1" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#06070a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambTop" cx="0.68" cy="0.0" r="0.45">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#06070a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arcGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="0.75" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arcGrad2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.68" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bentoFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13161f" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0c0e14" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151822" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0d0f16" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="topRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="traceBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="traceViolet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="frameClip">
      <rect x="0" y="0" width="1200" height="340" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <!-- Smooth OLED background + atmospheric lighting + sweeping orbital arcs -->
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#ambLeft)"/>
    <rect width="1200" height="340" fill="url(#ambRight)"/>
    <rect width="1200" height="340" fill="url(#ambTop)"/>

    <!-- Subtle sweeping orbital curves for depth (no grid) -->
    <path d="M -40 290 C 260 210, 520 330, 860 170 C 1020 95, 1140 110, 1240 60" fill="none" stroke="url(#arcGrad1)" stroke-width="1.5"/>
    <path d="M 420 -20 C 580 120, 780 40, 1220 240" fill="none" stroke="url(#arcGrad2)" stroke-width="1.2"/>
    <circle cx="960" cy="170" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    <circle cx="960" cy="170" r="290" fill="none" stroke="#ffffff" stroke-opacity="0.018" stroke-width="1"/>

    <!-- LEFT COLUMN: Eyebrow, Wordmark with Gemini Star, Subtitle, 2x2 Bento Cards -->
    <g transform="translate(48 28)">
      <rect width="326" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.11"/>
      <circle cx="15" cy="13" r="3.5" fill="#34d399"/>
      <text x="27" y="17" font-family="Consolas,'Cascadia Mono',SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" letter-spacing="0.7" fill="#cbd5e1">ANTIGRAVITY 2.34.0 · ZERO DEPS · NODE 20+</text>
    </g>

    <!-- Wordmark: gemini ✦ dsh -->
    <g transform="translate(46 110)">
      <text x="0" y="0" font-family="'Segoe UI Variable Display','Segoe UI',Inter,system-ui,sans-serif" font-size="66" font-weight="750" letter-spacing="-2.6" fill="url(#wordmark)">gemini</text>
      <!-- Crisp 4-point Gemini star emblem inside subtle glass ring -->
      <g transform="translate(244 -22)">
        <circle cx="0" cy="0" r="19" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.12"/>
        <path d="M 0 -12 C 1.2 -3.2 3.2 -1.2 12 0 C 3.2 1.2 1.2 3.2 0 12 C -1.2 3.2 -3.2 1.2 -12 0 C -3.2 -1.2 -1.2 -3.2 0 -12 Z" fill="url(#starGrad)"/>
      </g>
      <text x="278" y="0" font-family="'Segoe UI Variable Display','Segoe UI',Inter,system-ui,sans-serif" font-size="66" font-weight="750" letter-spacing="-2.6" fill="url(#wordmark)">dsh</text>
    </g>

    <text x="48" y="146" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Gemini 3.x / 4 и живой Google Search в DeepSeek Harness — без системного VPN
    </text>

    <!-- 2x2 Bento Feature Cards -->
    <g font-family="'Segoe UI',Inter,system-ui,sans-serif">
      <!-- Card 1: Smart rotation -->
      <g transform="translate(48 174)" filter="url(#shadow)">
        <rect width="282" height="62" rx="13" fill="url(#bentoFill)" stroke="#ffffff" stroke-opacity="0.09"/>
        <line x1="16" y1="0.5" x2="266" y2="0.5" stroke="url(#topRim)"/>
        <rect x="13" y="15" width="32" height="32" rx="9" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.28"/>
        <circle cx="29" cy="31" r="7.5" fill="none" stroke="#34d399" stroke-opacity="0.25" stroke-width="2.2"/>
        <path d="M 29 23.5 A 7.5 7.5 0 1 1 22.2 34.2" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>
        <text x="56" y="28" font-size="13" font-weight="650" fill="#f8fafc">Ротация и квоты 5h / 7d</text>
        <text x="56" y="45" font-size="11" fill="#94a3b8">Переключает аккаунт до 429</text>
      </g>

      <!-- Card 2: Google Search -->
      <g transform="translate(342 174)" filter="url(#shadow)">
        <rect width="282" height="62" rx="13" fill="url(#bentoFill)" stroke="#ffffff" stroke-opacity="0.09"/>
        <line x1="16" y1="0.5" x2="266" y2="0.5" stroke="url(#topRim)"/>
        <rect x="13" y="15" width="32" height="32" rx="9" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.28"/>
        <circle cx="27.5" cy="29.5" r="5.5" fill="none" stroke="#38bdf8" stroke-width="1.9"/>
        <line x1="31.5" y1="33.5" x2="35.5" y2="37.5" stroke="#38bdf8" stroke-width="1.9" stroke-linecap="round"/>
        <text x="56" y="28" font-size="13" font-weight="650" fill="#f8fafc">Google Search grounding</text>
        <text x="56" y="45" font-size="11" fill="#94a3b8">Сводка, ссылки и выбор модели</text>
      </g>

      <!-- Card 3: Scoped egress -->
      <g transform="translate(48 248)" filter="url(#shadow)">
        <rect width="282" height="62" rx="13" fill="url(#bentoFill)" stroke="#ffffff" stroke-opacity="0.09"/>
        <line x1="16" y1="0.5" x2="266" y2="0.5" stroke="url(#topRim)"/>
        <rect x="13" y="15" width="32" height="32" rx="9" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.28"/>
        <path d="M 29 23 L 35.5 25.8 V 31 C 35.5 35 32.7 37.8 29 39 C 25.3 37.8 22.5 35 22.5 31 V 25.8 Z" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linejoin="round"/>
        <text x="56" y="28" font-size="13" font-weight="650" fill="#f8fafc">Точечный выход в сеть</text>
        <text x="56" y="45" font-size="11" fill="#94a3b8">DNS · Proxy · VPN для googleapis</text>
      </g>

      <!-- Card 4: KV-cache & streaming -->
      <g transform="translate(342 248)" filter="url(#shadow)">
        <rect width="282" height="62" rx="13" fill="url(#bentoFill)" stroke="#ffffff" stroke-opacity="0.09"/>
        <line x1="16" y1="0.5" x2="266" y2="0.5" stroke="url(#topRim)"/>
        <rect x="13" y="15" width="32" height="32" rx="9" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.28"/>
        <path d="M 30 23 L 24 32 H 29 L 28 39 L 34 30 H 29 Z" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linejoin="round"/>
        <text x="56" y="28" font-size="13" font-weight="650" fill="#f8fafc">Быстрый стрим и кэш</text>
        <text x="56" y="45" font-size="11" fill="#94a3b8">KV keep-alive и докачка обрывов</text>
      </g>
    </g>

    <!-- RIGHT COLUMN: Sleek Telemetry & Pipeline Showcase -->
    <!-- Smooth curved signal traces -->
    <g fill="none">
      <path d="M 810 86 C 810 102, 810 104, 810 116" stroke="url(#traceBlue)" stroke-width="2"/>
      <circle cx="810" cy="101" r="3" fill="#60a5fa"/>
      <path d="M 790 206 C 790 220, 776 222, 776 236" stroke="url(#traceViolet)" stroke-width="1.8" stroke-dasharray="4 3"/>
      <circle cx="783" cy="221" r="2.8" fill="#a78bfa"/>
      <path d="M 1036 206 C 1036 220, 1042 222, 1042 236" stroke="#34d399" stroke-width="2.2" stroke-opacity="0.85"/>
      <circle cx="1039" cy="221" r="3" fill="#34d399"/>
      <path d="M 892 273 H 916" stroke="#34d399" stroke-width="1.6" stroke-opacity="0.55"/>
    </g>

    <!-- Top Card: DSH / OpenAI Client -->
    <g transform="translate(668 28)" filter="url(#shadow)">
      <rect width="484" height="58" rx="14" fill="url(#panelFill)" stroke="#ffffff" stroke-opacity="0.10"/>
      <line x1="18" y1="0.5" x2="466" y2="0.5" stroke="url(#topRim)"/>
      <rect x="14" y="14" width="30" height="30" rx="9" fill="#60a5fa" fill-opacity="0.14" stroke="#60a5fa" stroke-opacity="0.32"/>
      <path d="M 23 25 L 27 29 L 23 33 M 29 33 H 35" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="26" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="13.5" font-weight="650" fill="#f8fafc">DSH или любой OpenAI-клиент</text>
      <text x="56" y="44" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" fill="#8b92a5">POST /v1/chat/completions · /v1/search</text>
      <rect x="402" y="18" width="68" height="22" rx="11" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.3"/>
      <text x="436" y="32.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="600" fill="#93c5fd">OpenAI</text>
    </g>

    <!-- Center Hero Card: Local Bridge + Live Telemetry Strip -->
    <g transform="translate(668 116)" filter="url(#shadow)">
      <rect width="484" height="90" rx="14" fill="url(#panelFill)" stroke="#ffffff" stroke-opacity="0.12"/>
      <line x1="18" y1="0.5" x2="466" y2="0.5" stroke="url(#topRim)"/>
      <rect x="14" y="14" width="30" height="30" rx="9" fill="#f8fafc"/>
      <text x="29" y="34" text-anchor="middle" font-family="'Segoe UI',Inter,sans-serif" font-size="14" font-weight="800" fill="#090b10">A</text>
      <text x="56" y="26" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="13.5" font-weight="650" fill="#f8fafc">Локальный мост</text>
      <text x="176" y="26" font-family="Consolas,'Cascadia Mono',monospace" font-size="11.5" fill="#94a3b8">127.0.0.1:8787</text>
      <!-- Live route status pill on top right -->
      <rect x="344" y="15" width="126" height="22" rx="11" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.28"/>
      <circle cx="357" cy="26" r="3" fill="#34d399"/>
      <text x="366" y="29.5" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="600" fill="#6ee7b7">Antigravity 2.34</text>

      <!-- Telemetry strip inside bridge card -->
      <g transform="translate(14 54)" font-family="Consolas,'Cascadia Mono',monospace" font-size="10">
        <rect width="108" height="24" rx="7" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="54" y="15.5" text-anchor="middle" fill="#e2e8f0">5h Guard · 5%</text>

        <rect x="116" width="112" height="24" rx="7" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="172" y="15.5" text-anchor="middle" fill="#e2e8f0">KV Keep-Alive</text>

        <rect x="236" width="112" height="24" rx="7" fill="#38bdf8" fill-opacity="0.09" stroke="#38bdf8" stroke-opacity="0.25"/>
        <text x="292" y="15.5" text-anchor="middle" fill="#7dd3fc">3.5-flash-lite</text>

        <rect x="356" width="100" height="24" rx="7" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="406" y="15.5" text-anchor="middle" fill="#cbd5e1">140 tok/s</text>
      </g>
    </g>

    <!-- Bottom Left: Egress Shim -->
    <g transform="translate(668 236)" filter="url(#shadow)">
      <rect width="224" height="74" rx="14" fill="url(#panelFill)" stroke="#ffffff" stroke-opacity="0.10"/>
      <line x1="16" y1="0.5" x2="208" y2="0.5" stroke="url(#topRim)"/>
      <circle cx="22" cy="23" r="4.5" fill="#a78bfa"/>
      <text x="35" y="27" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="13" font-weight="650" fill="#f8fafc">Шим выхода</text>
      <text x="16" y="45" font-family="Consolas,'Cascadia Mono',monospace" font-size="10.5" fill="#94a3b8">127.0.0.1:8789 · DNS</text>
      <text x="16" y="61" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" fill="#c4b5fd">*.googleapis.com only</text>
    </g>

    <!-- Bottom Right: Google Cloud Code -->
    <g transform="translate(916 236)" filter="url(#shadow)">
      <rect width="236" height="74" rx="14" fill="url(#panelFill)" stroke="#34d399" stroke-opacity="0.30"/>
      <line x1="16" y1="0.5" x2="220" y2="0.5" stroke="url(#topRim)"/>
      <g transform="translate(15 15)">
        <circle cx="22" cy="22" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3.5"/>
        <circle cx="22" cy="22" r="18" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="14" transform="rotate(-90 22 22)"/>
        <text x="22" y="26" text-anchor="middle" font-family="'Segoe UI',Inter,sans-serif" font-size="11" font-weight="700" fill="#f8fafc">88%</text>
      </g>
      <text x="70" y="27" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="13" font-weight="650" fill="#f8fafc">Google Cloud Code</text>
      <text x="70" y="44" font-family="Consolas,'Cascadia Mono',monospace" font-size="10.5" fill="#94a3b8">Gemini 4 · 3.8 · Search</text>
      <rect x="70" y="51" width="72" height="16" rx="8" fill="#34d399" fill-opacity="0.14"/>
      <text x="106" y="62" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="600" fill="#34d399">200 OK</text>
    </g>

    <!-- Outer hairline border -->
    <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
  </g>
</svg>
